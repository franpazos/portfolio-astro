<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Parnassus mobile app: a reading club screen on a phone">
  <defs>
    <linearGradient id="cover-slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a7290"/><stop offset="1" stop-color="#38485c"/>
    </linearGradient>
    <linearGradient id="cover-terra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8574a"/><stop offset="1" stop-color="#7d3d33"/>
    </linearGradient>
    <linearGradient id="cover-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a8a6a"/><stop offset="1" stop-color="#3d6149"/>
    </linearGradient>
    <linearGradient id="cover-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8db5"/><stop offset="1" stop-color="#6f6487"/>
    </linearGradient>
    <linearGradient id="avatar-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0d2ae"/><stop offset="1" stop-color="#c0a86f"/>
    </linearGradient>
    <clipPath id="screen"><rect x="414" y="54" width="372" height="792" rx="36"/></clipPath>
    <filter id="phoneshadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ===== phone body ===== -->
  <rect x="400" y="40" width="400" height="820" rx="52" fill="#1F2430" filter="url(#phoneshadow)"/>
  <rect x="400" y="40" width="400" height="820" rx="52" fill="none" stroke="#2c3340" stroke-width="2"/>

  <g clip-path="url(#screen)" font-family="Georgia, 'Times New Roman', serif">
    <!-- app background -->
    <rect x="414" y="54" width="372" height="792" fill="#FBFAF7"/>

    <!-- dynamic island -->
    <rect x="545" y="70" width="110" height="26" rx="13" fill="#1F2430"/>

    <!-- status bar -->
    <text x="446" y="97" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2430">9:41</text>
    <rect x="730" y="85" width="26" height="13" rx="3" fill="none" stroke="#8A8272" stroke-width="1.4"/>
    <rect x="732.5" y="87.5" width="18" height="8" rx="1.5" fill="#8A8272"/>
    <rect x="757" y="88" width="2.4" height="7" rx="1" fill="#8A8272"/>

    <!-- app header -->
    <g transform="translate(446,126) scale(0.2)" fill="none" stroke="#1F2430" stroke-linecap="butt">
      <path d="M14 88L14 60" stroke-width="11"/>
      <path d="M35 88L35 36" stroke-width="14"/>
      <path d="M57 88L57 11" stroke-width="10"/>
      <path d="M82 88L59 26" stroke-width="12"/>
    </g>
    <text x="472" y="146" font-size="20" letter-spacing="1" fill="#1F2430">Parnassus</text>
    <circle cx="734" cy="138" r="17" fill="url(#avatar-gold)"/>
    <text x="734" y="144" text-anchor="middle" font-size="16" fill="#3D2E10">F</text>
    <line x1="442" y1="172" x2="758" y2="172" stroke="#E6E0D6" stroke-width="1"/>

    <!-- club title -->
    <text x="442" y="212" font-size="26" fill="#1F2430">The Athenaeum</text>
    <text x="442" y="240" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#B4894B">CURRENTLY READING</text>

    <!-- currently reading -->
    <rect x="442" y="256" width="92" height="132" rx="5" fill="url(#cover-slate)"/>
    <rect x="442" y="256" width="9" height="132" rx="5" fill="#2f3c4d"/>
    <rect x="462" y="286" width="60" height="2" fill="#CBB88A" fill-opacity="0.8"/>
    <text x="462" y="318" font-size="13" fill="#F1EDE5">The</text>
    <text x="462" y="335" font-size="13" fill="#F1EDE5">Overstory</text>

    <text x="552" y="286" font-size="19" fill="#1F2430">The Overstory</text>
    <text x="552" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8A8272">Richard Powers</text>
    <rect x="552" y="330" width="206" height="8" rx="4" fill="#E6E0D6"/>
    <rect x="552" y="330" width="128" height="8" rx="4" fill="#CBB88A"/>
    <text x="552" y="360" font-family="'Courier New', monospace" font-size="12" fill="#6b6354">62%  ·  214 / 345</text>
    <rect x="552" y="374" width="90" height="26" rx="13" fill="#E7F0E9"/>
    <circle cx="570" cy="387" r="4" fill="#4E7A5E"/>
    <text x="582" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4E7A5E">On pace</text>

    <line x1="442" y1="424" x2="758" y2="424" stroke="#E6E0D6" stroke-width="1"/>

    <!-- up next · vote -->
    <text x="442" y="452" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#B4894B">UP NEXT · VOTE</text>
    <rect x="442" y="468" width="94" height="134" rx="5" fill="url(#cover-terra)"/>
    <rect x="553" y="468" width="94" height="134" rx="5" fill="url(#cover-green)"/>
    <rect x="664" y="468" width="94" height="134" rx="5" fill="url(#cover-plum)"/>
    <text x="489" y="622" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2430">Piranesi</text>
    <text x="600" y="622" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2430">Babel</text>
    <text x="711" y="622" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F2430">Circe</text>
    <rect x="442" y="632" width="94" height="6" rx="3" fill="#E6E0D6"/>
    <rect x="442" y="632" width="60" height="6" rx="3" fill="#4E6480"/>
    <rect x="553" y="632" width="94" height="6" rx="3" fill="#E6E0D6"/>
    <rect x="553" y="632" width="36" height="6" rx="3" fill="#4E6480"/>
    <rect x="664" y="632" width="94" height="6" rx="3" fill="#E6E0D6"/>
    <rect x="664" y="632" width="22" height="6" rx="3" fill="#4E6480"/>

    <!-- reading goal -->
    <text x="442" y="682" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8A8272">GOAL · FINISH BY MAR 30</text>
    <rect x="442" y="696" width="316" height="8" rx="4" fill="#E6E0D6"/>
    <rect x="442" y="696" width="210" height="8" rx="4" fill="#CBB88A"/>

    <!-- members -->
    <text x="442" y="742" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8A8272">MEMBERS · 6</text>
    <circle cx="456" cy="762" r="14" fill="url(#avatar-gold)"/>
    <circle cx="486" cy="762" r="14" fill="url(#cover-slate)"/>
    <circle cx="516" cy="762" r="14" fill="url(#cover-green)"/>
    <circle cx="546" cy="762" r="14" fill="url(#cover-terra)"/>
    <circle cx="576" cy="762" r="14" fill="url(#cover-plum)"/>
    <circle cx="606" cy="762" r="14" fill="#E6E0D6"/>
    <text x="606" y="767" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A8272">+1</text>

    <!-- bottom tab bar -->
    <rect x="414" y="790" width="372" height="56" fill="#F7F4EE"/>
    <line x1="414" y1="790" x2="786" y2="790" stroke="#E6E0D6" stroke-width="1"/>
    <!-- active: clubs -->
    <g transform="translate(475,809) scale(0.15)" fill="none" stroke="#B4894B" stroke-linecap="butt">
      <path d="M14 88L14 60" stroke-width="11"/>
      <path d="M35 88L35 36" stroke-width="14"/>
      <path d="M57 88L57 11" stroke-width="10"/>
      <path d="M82 88L59 26" stroke-width="12"/>
    </g>
    <text x="482" y="838" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#B4894B">Clubs</text>
    <!-- wishlist -->
    <path d="M555 810 h12 v20 l-6 -5 l-6 5 z" fill="none" stroke="#8A8272" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="561" y="838" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8A8272">Wishlist</text>
    <!-- stats -->
    <rect x="634" y="822" width="4" height="8" rx="1" fill="#8A8272"/>
    <rect x="640" y="818" width="4" height="12" rx="1" fill="#8A8272"/>
    <rect x="646" y="814" width="4" height="16" rx="1" fill="#8A8272"/>
    <text x="640" y="838" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8A8272">Stats</text>
    <!-- profile -->
    <circle cx="719" cy="814" r="5" fill="none" stroke="#8A8272" stroke-width="1.8"/>
    <path d="M710 830 a9 9 0 0 1 18 0" fill="none" stroke="#8A8272" stroke-width="1.8"/>
    <text x="719" y="838" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8A8272">You</text>
  </g>
</svg>
